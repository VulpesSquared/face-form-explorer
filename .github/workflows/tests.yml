name: Tests and MediaPipe inference

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-mediapipe-101:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install MediaPipe native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libgl1 libglib2.0-0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Download public fixtures and official model
        run: python -m scripts.download_test_assets
      - name: Run unit, Streamlit, and real MediaPipe 1.0.1 tests
        run: python -m pytest -q --run-integration
